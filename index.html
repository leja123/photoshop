<!DOCTYPE html>
<html>
    <head>
        <title>Photoshop</title>
        <meta charset="UTF-8">
        <style>
            #canvas {
                max-width: 500px; 
                max-height: 500px; 
            }

        </style> 
    </head>
    <body>
        <h1>Photoshop</h1>
        <input type="file" id="fileInput"><br><br>
        <canvas id="canvas"></canvas><br><br>

        <h2>Tools:</h2>
        Grayscale:
        <button id="grayscale">Grayscale</button><br>
        Treshold: 
        <input type="range" min="0" max="255" value="128" id="treshold"><br>
        Odstrani kanal: 
        <button id="removeRed">Red</button>
        <button id="removeGreen">Green</button>
        <button id="removeBlue">Blue</button><br>
        Highlight color:<br>
        Red: <input type="range" min="0" max="2" value="1" step="0.1" id="highlightRed"><br>
		Green: <input type="range" min="0" max="2" value="1" step="0.1" id="highlightGreen"><br>
		Blue: <input type="range" min="0" max="2" value="1" step="0.1" id="highlightBlue"><br>
        Brightness:
        <input type="range" min="-10" max="10" value="0" id="brightness">

        <h2>Advanced tools</h2>
        <button id="boxBlur">Box blur</button><br>
		<button id="gaussianBlur">Gaussian blur</button><br>
		<button id="sobel">Sobel</button><br>
		<button id="laplac">Laplac</button><br>
		<button id="sharpening">Sharpening mask</button><br>
		<button id="unsharpening">Unsharpening mask</button><br>







        <script src="upload.js"></script>
        <script src="filters.js"></script>
    </body>
</html>
